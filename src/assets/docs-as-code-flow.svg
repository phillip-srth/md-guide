<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">Docs-as-Code workflow</title>
  <desc id="desc">A linear workflow from authoring Markdown through review, CI quality gates, and static site publishing.</desc>
  <rect width="980" height="260" rx="16" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(40 72)">
      <rect width="150" height="88" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="75" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Write</text>
      <text x="75" y="60" text-anchor="middle" font-size="14" fill="#1e40af">Markdown</text>
    </g>
    <g transform="translate(240 72)">
      <rect width="150" height="88" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <text x="75" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#134e4a">Review</text>
      <text x="75" y="60" text-anchor="middle" font-size="14" fill="#0f766e">Pull request</text>
    </g>
    <g transform="translate(440 72)">
      <rect width="150" height="88" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
      <text x="75" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Validate</text>
      <text x="75" y="60" text-anchor="middle" font-size="14" fill="#92400e">CI gates</text>
    </g>
    <g transform="translate(640 72)">
      <rect width="150" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="75" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Build</text>
      <text x="75" y="60" text-anchor="middle" font-size="14" fill="#6d28d9">mdBook</text>
    </g>
    <g transform="translate(820 72)">
      <rect width="120" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="60" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Publish</text>
      <text x="60" y="60" text-anchor="middle" font-size="14" fill="#166534">Static site</text>
    </g>
    <line x1="198" y1="116" x2="232" y2="116" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="398" y1="116" x2="432" y2="116" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="598" y1="116" x2="632" y2="116" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="798" y1="116" x2="812" y2="116" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="490" y="210" text-anchor="middle" font-size="16" fill="#475569">Plain-text docs move through the same review and release system as code.</text>
  </g>
</svg>
